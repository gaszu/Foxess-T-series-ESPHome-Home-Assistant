# ESPHome 2026.10.2+. Retains the original, working telemetry layout.
# See home-assistant/README_PL.md for production statistics without a grid meter.
esphome:
  name: foxess-inverter
  min_version: 2026.10.2
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
  level: VERBOSE
  baud_rate: 0
api: null
ota:
- platform: esphome
  password: '***********************'
wifi:
  ssid: '***************************'
  password: '*********************'
  ap:
    ssid: Inverter Fallback Hotspot
    password: '*****************+'
captive_portal: null
uart:
  id: uart_bus
  tx_pin: 16
  rx_pin: 17
  baud_rate: 9600
button:
- platform: restart
  name: Foxess inverter restart
switch:
- platform: gpio
  pin: 4
  name: T-Series sending mode
  internal: true
sensor:
- platform: foxess_t_series
  uart_id: uart_bus
  inverter_mode:
    name: T-Series Inverter Mode
  faults:
    name: T-Series Faults
  connected:
    name: T-Series Communication
  grid_power:
    name: T-Series Grid Power
    id: grid_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
    internal: true
  generation_power:
    name: T-Series Generation Power
    id: generation_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
  loads_power:
    name: T-Series loads Power
    id: loads_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
    internal: true
  grid_voltage_r:
    name: T-Series Grid Voltage R
    id: grid_voltage_r
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
    - throttle: 1h
  grid_current_r:
    name: T-Series Grid Current R
    id: grid_current_r
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  grid_frequency_r:
    name: T-Series Grid Frequency R
    id: grid_Frequency_r
    unit_of_measurement: Hz
    accuracy_decimals: 2
    icon: mdi:sine-wave
    filters:
    - multiply: 0.01
    - throttle: 1h
  grid_power_r:
    name: T-Series Grid Power R
    id: grid_power_r
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
  grid_voltage_s:
    name: T-Series Grid Voltage S
    id: grid_voltage_s
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
    - throttle: 1h
  grid_current_s:
    name: T-Series Grid Current S
    id: grid_current_s
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  grid_frequency_s:
    name: T-Series Grid Frequency S
    id: grid_Frequency_s
    unit_of_measurement: Hz
    accuracy_decimals: 2
    icon: mdi:sine-wave
    filters:
    - multiply: 0.01
    - throttle: 1h
  grid_power_s:
    name: T-Series Grid Power S
    id: grid_power_s
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
  grid_voltage_T:
    name: T-Series Grid Voltage T
    id: grid_voltage_T
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
    - throttle: 1h
  grid_current_T:
    name: T-Series Grid Current T
    id: grid_current_t
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  grid_frequency_T:
    name: T-Series Grid Frequency T
    id: grid_Frequency_t
    unit_of_measurement: Hz
    accuracy_decimals: 2
    icon: mdi:sine-wave
    filters:
    - multiply: 0.01
    - throttle: 1h
  grid_power_T:
    name: T-Series Grid Power T
    id: grid_power_t
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    device_class: power
    state_class: measurement
  pv1_voltage:
    name: T-Series PV1 Voltage
    id: pv1_voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
  pv1_current:
    name: T-Series PV1 Current
    id: pv1_current
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  pv2_voltage:
    name: T-Series PV2 Voltage
    id: pv2_voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
  pv2_current:
    name: T-Series PV2 Current
    id: pv2_current
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  pv3_voltage:
    name: T-Series PV3 Voltage
    id: pv3_voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
  pv3_current:
    name: T-Series PV3 Current
    id: pv3_current
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  pv4_voltage:
    name: T-Series PV4 Voltage
    id: pv4_voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    icon: mdi:flash
    filters:
    - multiply: 0.1
  pv4_current:
    name: T-Series PV4 Current
    id: pv4_current
    unit_of_measurement: A
    accuracy_decimals: 1
    icon: mdi:current-ac
    filters:
    - multiply: 0.1
  boost_temperature:
    name: T-Series Boost Temperature
    id: boost_temperature
    unit_of_measurement: °C
    filters:
    - throttle: 10min
  inverter_temperature:
    name: T-Series Inverter Temperature
    id: inverter_temperature
    unit_of_measurement: °C
    filters:
    - throttle: 10min
  ambient_temperature:
    name: T-Series Ambient Temperature
    id: ambient_temperature
    unit_of_measurement: °C
    filters:
    - throttle: 10min
  today_yield:
    name: T-Series Today Yield
    id: today_yield
    unit_of_measurement: kWh
    accuracy_decimals: 1
    icon: mdi:solar-power
    filters:
    - multiply: 0.1
    device_class: energy
    state_class: total_increasing
  generation_total:
    name: T-Series Generation Total
    id: generation_total
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    icon: mdi:solar-power
    filters:
    - multiply: 0.1
  pv1_power:
    name: T-Series PV1 Power
    id: pv1_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
  pv2_power:
    name: T-Series PV2 Power
    id: pv2_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
  pv3_power:
    name: T-Series PV3 Power
    id: pv3_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
  pv4_power:
    name: T-Series PV4 Power
    id: pv4_power
    unit_of_measurement: W
    icon: mdi:lightning-bolt
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
  inverter_state:
    name: T-Series Inverter State
    id: inverter_state
    internal: true
- platform: integration
  name: T-Series PV1 Energy Estimated
  sensor: pv1_power
  time_unit: h
  integration_method: left
  restore: true
  unit_of_measurement: kWh
  accuracy_decimals: 3
  device_class: energy
  state_class: total_increasing
  filters:
  - multiply: 0.001
- platform: integration
  name: T-Series PV2 Energy Estimated
  sensor: pv2_power
  time_unit: h
  integration_method: left
  restore: true
  unit_of_measurement: kWh
  accuracy_decimals: 3
  device_class: energy
  state_class: total_increasing
  filters:
  - multiply: 0.001
external_components:
- source:
    type: local
    path: components
  components:
  - foxess_t_series
